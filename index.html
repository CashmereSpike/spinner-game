<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Top Battle Spinner - Improved</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .ui {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.45);
      padding: 12px 14px;
      border-radius: 10px;
      line-height: 1.6;
      font-size: 14px;
    }

    .message {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: rgba(0, 0, 0, 0.55);
      z-index: 20;
      text-align: center;
    }

    .message h1 {
      margin: 0 0 12px;
      font-size: 42px;
    }

    .message button {
      font-size: 18px;
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <div class="ui">
    <div><strong>操作方法</strong></div>
    <div>↑ ↓ ← → : 移動</div>
    <div>相手を武器で押し出して、ステージ外に落とす</div>
    <div>R : リスタート</div>
    <div>※ 最初のキー入力で音が有効になります</div>
  </div>

  <div class="message" id="messageBox">
    <h1 id="messageText">YOU WIN</h1>
    <button onclick="resetGame()">もう一回</button>
  </div>

  <canvas id="game"></canvas>

  <script>
    /*
      ========================================
      1. 基本設定
      ========================================
    */
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const messageBox = document.getElementById("messageBox");
    const messageText = document.getElementById("messageText");

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    /*
      ========================================
      2. キー入力
      ========================================
    */
    const keys = {};

    window.addEventListener("keydown", (e) => {
      keys[e.key] = true;

      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(e.key)) {
        e.preventDefault();
      }

      if (e.key === "r" || e.key === "R") {
        resetGame();
      }

      // ユーザー操作があった時点で音を有効化
      unlockAudio();
    });

    window.addEventListener("keyup", (e) => {
      keys[e.key] = false;
    });

    /*
      ========================================
      3. ステージ設定
      ========================================
    */
    const stage = {
      get x() {
        return canvas.width / 2;
      },
      get y() {
        return canvas.height / 2;
      },
      get radius() {
        return Math.min(canvas.width, canvas.height) * 0.34;
      }
    };

    /*
      ========================================
      4. 効果音
      ========================================
      外部ファイルを使わず、ブラウザ内で簡単な音を作る。
      GitHub Pagesでもそのまま動く。
    */
    let audioContext = null;
    let audioUnlocked = false;

    function unlockAudio() {
      if (audioUnlocked) return;

      try {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        audioUnlocked = true;
      } catch (err) {
        console.log("Audio not available:", err);
      }
    }

    // 短い電子音を鳴らす関数
    function playBeep(freq = 440, duration = 0.06, type = "square", volume = 0.03) {
      if (!audioUnlocked || !audioContext) return;

      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();

      osc.type = type;
      osc.frequency.value = freq;

      gain.gain.value = volume;
      gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + duration);

      osc.connect(gain);
      gain.connect(audioContext.destination);

      osc.start();
      osc.stop(audioContext.currentTime + duration);
    }

    function playHitSound() {
      playBeep(220, 0.05, "sawtooth", 0.04);
      setTimeout(() => playBeep(160, 0.05, "square", 0.03), 20);
    }

    function playWinSound() {
      playBeep(523, 0.08, "square", 0.04);
      setTimeout(() => playBeep(659, 0.08, "square", 0.04), 100);
      setTimeout(() => playBeep(784, 0.14, "square", 0.05), 200);
    }

    function playLoseSound() {
      playBeep(300, 0.08, "triangle", 0.04);
      setTimeout(() => playBeep(220, 0.10, "triangle", 0.04), 100);
      setTimeout(() => playBeep(160, 0.14, "triangle", 0.05), 220);
    }

    /*
      ========================================
      5. エフェクト用の粒
      ========================================
      ヒットした場所に小さな火花を出す。
    */
    const particles = [];

    function spawnHitEffect(x, y, color = "#ffd54f") {
      for (let i = 0; i < 12; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 3;

        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 24 + Math.floor(Math.random() * 10),
          maxLife: 24 + Math.floor(Math.random() * 10),
          size: 2 + Math.random() * 3,
          color
        });
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];

        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.97;
        p.vy *= 0.97;
        p.life--;

        if (p.life <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    function drawParticles() {
      for (const p of particles) {
        const alpha = p.life / p.maxLife;
        ctx.globalAlpha = alpha;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    /*
      ========================================
      6. コマ生成
      ========================================
    */
    function createSpinner(options) {
      return {
        x: options.x,
        y: options.y,
        vx: 0,
        vy: 0,
        radius: options.radius || 24,
        color: options.color || "skyblue",
        weaponLength: options.weaponLength || 26,
        weaponWidth: options.weaponWidth || 10,
        angle: 0,
        spinSpeed: options.spinSpeed || 0.22,
        movePower: options.movePower || 0.28,
        friction: options.friction || 0.985,
        maxSpeed: options.maxSpeed || 5.0,
        isCPU: options.isCPU || false,
        hitCooldown: 0,
        name: options.name || "spinner"
      };
    }

    let player, cpu, gameOver;

    /*
      ========================================
      7. 初期化
      ========================================
    */
    function resetGame() {
      player = createSpinner({
        x: stage.x - 120,
        y: stage.y,
        color: "#4da6ff",
        name: "player",
        movePower: 0.30,
        maxSpeed: 5.3,
        spinSpeed: 0.24
      });

      cpu = createSpinner({
        x: stage.x + 120,
        y: stage.y,
        color: "#ff6b6b",
        isCPU: true,
        name: "cpu",
        movePower: 0.31,
        maxSpeed: 5.5,
        spinSpeed: 0.26
      });

      particles.length = 0;
      gameOver = false;
      messageBox.style.display = "none";
    }

    resetGame();

    /*
      ========================================
      8. 補助関数
      ========================================
    */
    function distance(ax, ay, bx, by) {
      return Math.hypot(bx - ax, by - ay);
    }

    function limitSpeed(obj) {
      const speed = Math.hypot(obj.vx, obj.vy);
      if (speed > obj.maxSpeed) {
        const rate = obj.maxSpeed / speed;
        obj.vx *= rate;
        obj.vy *= rate;
      }
    }

    function getWeaponTip(spinner) {
      const lengthFromCenter = spinner.radius + spinner.weaponLength;
      return {
        x: spinner.x + Math.cos(spinner.angle) * lengthFromCenter,
        y: spinner.y + Math.sin(spinner.angle) * lengthFromCenter
      };
    }

    /*
      ========================================
      9. プレイヤー更新
      ========================================
    */
    function updatePlayer(spinner) {
      if (keys["ArrowUp"]) spinner.vy -= spinner.movePower;
      if (keys["ArrowDown"]) spinner.vy += spinner.movePower;
      if (keys["ArrowLeft"]) spinner.vx -= spinner.movePower;
      if (keys["ArrowRight"]) spinner.vx += spinner.movePower;
    }

    /*
      ========================================
      10. CPU強化
      ========================================
      前より少し賢くする。
      - プレイヤーへ寄る
      - 外周に行きすぎたら中央寄りに戻る
      - 少し横に回り込む
    */
    function updateCPU(spinner, target) {
      const dx = target.x - spinner.x;
      const dy = target.y - spinner.y;
      const d = Math.hypot(dx, dy) || 1;

      // プレイヤーへ向かう基本移動
      const chaseX = (dx / d) * spinner.movePower * 0.90;
      const chaseY = (dy / d) * spinner.movePower * 0.90;

      // 少しだけ回り込む動き
      const sideX = (-dy / d) * 0.05;
      const sideY = (dx / d) * 0.05;

      // ステージ中央からの距離
      const centerDx = stage.x - spinner.x;
      const centerDy = stage.y - spinner.y;
      const centerDist = Math.hypot(centerDx, centerDy) || 1;

      let recoverX = 0;
      let recoverY = 0;

      // 外周に寄りすぎたら中央方向へ戻る力を強める
      if (centerDist > stage.radius * 0.72) {
        recoverX = (centerDx / centerDist) * 0.18;
        recoverY = (centerDy / centerDist) * 0.18;
      }

      spinner.vx += chaseX + sideX + recoverX;
      spinner.vy += chaseY + sideY + recoverY;
    }

    /*
      ========================================
      11. コマ更新
      ========================================
    */
    function updateSpinner(spinner) {
      spinner.x += spinner.vx;
      spinner.y += spinner.vy;

      spinner.vx *= spinner.friction;
      spinner.vy *= spinner.friction;

      spinner.angle += spinner.spinSpeed;

      limitSpeed(spinner);

      if (spinner.hitCooldown > 0) {
        spinner.hitCooldown--;
      }
    }

    /*
      ========================================
      12. 本体同士の接触
      ========================================
    */
    function resolveBodyCollision(a, b) {
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const d = Math.hypot(dx, dy);
      const minDist = a.radius + b.radius;

      if (d > 0 && d < minDist) {
        const overlap = minDist - d;
        const nx = dx / d;
        const ny = dy / d;

        a.x -= nx * overlap * 0.5;
        a.y -= ny * overlap * 0.5;
        b.x += nx * overlap * 0.5;
        b.y += ny * overlap * 0.5;

        a.vx -= nx * 0.15;
        a.vy -= ny * 0.15;
        b.vx += nx * 0.15;
        b.vy += ny * 0.15;
      }
    }

    /*
      ========================================
      13. 武器ヒット処理
      ========================================
      当たったら
      - 吹き飛ばす
      - エフェクトを出す
      - 音を鳴らす
    */
    function handleWeaponHit(attacker, defender) {
      if (attacker.hitCooldown > 0) return;

      const tip = getWeaponTip(attacker);
      const d = distance(tip.x, tip.y, defender.x, defender.y);

      if (d < defender.radius + attacker.weaponWidth) {
        const dx = defender.x - attacker.x;
        const dy = defender.y - attacker.y;
        const len = Math.hypot(dx, dy) || 1;

        const nx = dx / len;
        const ny = dy / len;

        defender.vx += nx * 2.5;
        defender.vy += ny * 2.5;

        attacker.vx -= nx * 0.40;
        attacker.vy -= ny * 0.40;

        attacker.hitCooldown = 12;

        // ヒット地点っぽい位置にエフェクト
        spawnHitEffect(tip.x, tip.y, "#ffd54f");

        // 効果音
        playHitSound();
      }
    }

    /*
      ========================================
      14. リングアウト判定
      ========================================
    */
    function checkRingOut(spinner) {
      const dFromCenter = distance(spinner.x, spinner.y, stage.x, stage.y);
      return dFromCenter > stage.radius + spinner.radius;
    }

    /*
      ========================================
      15. 勝敗処理
      ========================================
    */
    function endGame(text) {
      if (gameOver) return;

      gameOver = true;
      messageText.textContent = text;
      messageBox.style.display = "flex";

      if (text === "YOU WIN") {
        playWinSound();
      } else {
        playLoseSound();
      }
    }

    /*
      ========================================
      16. 描画
      ========================================
    */
    function drawBackground() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const g = ctx.createRadialGradient(
        stage.x, stage.y, 50,
        stage.x, stage.y, Math.max(canvas.width, canvas.height)
      );
      g.addColorStop(0, "#1d1d1d");
      g.addColorStop(1, "#090909");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawStage() {
      ctx.beginPath();
      ctx.arc(stage.x, stage.y, stage.radius, 0, Math.PI * 2);
      ctx.fillStyle = "#2c2c2c";
      ctx.fill();

      ctx.beginPath();
      ctx.arc(stage.x, stage.y, stage.radius * 0.78, 0, Math.PI * 2);
      ctx.fillStyle = "#222";
      ctx.fill();

      ctx.beginPath();
      ctx.arc(stage.x, stage.y, stage.radius, 0, Math.PI * 2);
      ctx.lineWidth = 8;
      ctx.strokeStyle = "#888";
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(stage.x, stage.y, stage.radius * 0.18, 0, Math.PI * 2);
      ctx.lineWidth = 3;
      ctx.strokeStyle = "rgba(255,255,255,0.12)";
      ctx.stroke();
    }

    function drawSpinner(spinner) {
      ctx.save();
      ctx.translate(spinner.x, spinner.y);
      ctx.rotate(spinner.angle);

      ctx.beginPath();
      ctx.arc(3, 4, spinner.radius, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(0,0,0,0.28)";
      ctx.fill();

      ctx.beginPath();
      ctx.arc(0, 0, spinner.radius, 0, Math.PI * 2);
      ctx.fillStyle = spinner.color;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(0, 0, spinner.radius, 0, Math.PI * 2);
      ctx.lineWidth = 4;
      ctx.strokeStyle = "rgba(255,255,255,0.35)";
      ctx.stroke();

      ctx.fillStyle = "#ffd54f";
      ctx.fillRect(
        spinner.radius - 2,
        -spinner.weaponWidth / 2,
        spinner.weaponLength,
        spinner.weaponWidth
      );

      ctx.beginPath();
      ctx.arc(
        spinner.radius + spinner.weaponLength,
        0,
        spinner.weaponWidth * 0.55,
        0,
        Math.PI * 2
      );
      ctx.fillStyle = "#fff1a8";
      ctx.fill();

      ctx.beginPath();
      ctx.arc(0, 0, 7, 0, Math.PI * 2);
      ctx.fillStyle = "#ffffff";
      ctx.fill();

      ctx.restore();
    }

    /*
      ========================================
      17. 更新
      ========================================
    */
    function update() {
      if (gameOver) return;

      updatePlayer(player);
      updateCPU(cpu, player);

      updateSpinner(player);
      updateSpinner(cpu);

      resolveBodyCollision(player, cpu);

      handleWeaponHit(player, cpu);
      handleWeaponHit(cpu, player);

      updateParticles();

      if (checkRingOut(player)) {
        endGame("YOU LOSE");
      } else if (checkRingOut(cpu)) {
        endGame("YOU WIN");
      }
    }

    /*
      ========================================
      18. 描画呼び出し
      ========================================
    */
    function draw() {
      drawBackground();
      drawStage();
      drawSpinner(player);
      drawSpinner(cpu);
      drawParticles();
    }

    /*
      ========================================
      19. メインループ
      ========================================
    */
    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
