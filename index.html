<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shape Battle Arena</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .ui {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.55);
      padding: 12px 14px;
      border-radius: 12px;
      line-height: 1.6;
      font-size: 14px;
      min-width: 300px;
    }

    .bar-wrap {
      margin-top: 8px;
      margin-bottom: 8px;
    }

    .bar-label {
      font-size: 12px;
      margin-bottom: 4px;
    }

    .bar-bg {
      width: 220px;
      height: 14px;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .bar-fill {
      height: 100%;
      width: 100%;
      transition: width 0.08s linear;
    }

    #playerHpBar {
      background: #4da6ff;
    }

    #cpuHpBar {
      background: #ff6b6b;
    }

    .message {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: rgba(0, 0, 0, 0.55);
      z-index: 20;
      text-align: center;
    }

    .message h1 {
      margin: 0 0 12px;
      font-size: 42px;
    }

    .message button {
      font-size: 18px;
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <div class="ui">
    <div><strong>操作方法</strong></div>
    <div>↑ ↓ ← → : 移動</div>
    <div>R : リスタート</div>
    <div>相手に体当たりしてHPを削る / 外に落とす</div>
    <div>プレイヤー形状: <strong>星型</strong></div>
    <div>CPU形状: <strong>ひし形</strong></div>

    <div class="bar-wrap">
      <div class="bar-label" id="playerHpText">PLAYER HP: 100 / 100</div>
      <div class="bar-bg">
        <div class="bar-fill" id="playerHpBar"></div>
      </div>
    </div>

    <div class="bar-wrap">
      <div class="bar-label" id="cpuHpText">CPU HP: 100 / 100</div>
      <div class="bar-bg">
        <div class="bar-fill" id="cpuHpBar"></div>
      </div>
    </div>

    <div>※ 最初のキー入力で音が有効になります</div>
  </div>

  <div class="message" id="messageBox">
    <h1 id="messageText">YOU WIN</h1>
    <button onclick="resetGame()">もう一回</button>
  </div>

  <canvas id="game"></canvas>

  <script>
    /*
      ========================================
      1. 基本設定
      ========================================
    */
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const messageBox = document.getElementById("messageBox");
    const messageText = document.getElementById("messageText");

    const playerHpText = document.getElementById("playerHpText");
    const cpuHpText = document.getElementById("cpuHpText");
    const playerHpBar = document.getElementById("playerHpBar");
    const cpuHpBar = document.getElementById("cpuHpBar");

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    /*
      ========================================
      2. キー入力
      ========================================
    */
    const keys = {};

    window.addEventListener("keydown", (e) => {
      keys[e.key] = true;

      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(e.key)) {
        e.preventDefault();
      }

      if (e.key === "r" || e.key === "R") {
        resetGame();
      }

      unlockAudio();
    });

    window.addEventListener("keyup", (e) => {
      keys[e.key] = false;
    });

    /*
      ========================================
      3. ステージ
      ========================================
    */
    const stage = {
      get x() {
        return canvas.width / 2;
      },
      get y() {
        return canvas.height / 2;
      },
      get radius() {
        return Math.min(canvas.width, canvas.height) * 0.34;
      }
    };

    /*
      ========================================
      4. 効果音
      ========================================
    */
    let audioContext = null;
    let audioUnlocked = false;

    function unlockAudio() {
      if (audioUnlocked) return;
      try {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        audioUnlocked = true;
      } catch (err) {
        console.log("Audio not available:", err);
      }
    }

    function playBeep(freq = 440, duration = 0.06, type = "square", volume = 0.03) {
      if (!audioUnlocked || !audioContext) return;

      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();

      osc.type = type;
      osc.frequency.value = freq;

      gain.gain.value = volume;
      gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + duration);

      osc.connect(gain);
      gain.connect(audioContext.destination);

      osc.start();
      osc.stop(audioContext.currentTime + duration);
    }

    function playHitSound() {
      playBeep(220, 0.04, "sawtooth", 0.04);
      setTimeout(() => playBeep(180, 0.04, "square", 0.03), 15);
    }

    function playWinSound() {
      playBeep(523, 0.08, "square", 0.04);
      setTimeout(() => playBeep(659, 0.08, "square", 0.04), 100);
      setTimeout(() => playBeep(784, 0.14, "square", 0.05), 200);
    }

    function playLoseSound() {
      playBeep(300, 0.08, "triangle", 0.04);
      setTimeout(() => playBeep(220, 0.10, "triangle", 0.04), 100);
      setTimeout(() => playBeep(160, 0.14, "triangle", 0.05), 220);
    }

    /*
      ========================================
      5. ヒットエフェクト
      ========================================
    */
    const particles = [];

    function spawnHitEffect(x, y, color = "#ffd54f") {
      for (let i = 0; i < 14; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 3.2;

        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 20 + Math.floor(Math.random() * 12),
          maxLife: 20 + Math.floor(Math.random() * 12),
          size: 2 + Math.random() * 3,
          color
        });
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.97;
        p.vy *= 0.97;
        p.life--;

        if (p.life <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    function drawParticles() {
      for (const p of particles) {
        const alpha = p.life / p.maxLife;
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    /*
      ========================================
      6. 形状ごとの設定
      ========================================
      shapeType を変えると、
      見た目・攻撃力・弾き飛ばし力が変わる
    */
    const SHAPE_TYPES = {
      triangle: {
        damage: 10,
        knockback: 2.7,
        hitRadiusBonus: 2,
        colorAccent: "#ffd54f"
      },
      square: {
        damage: 8,
        knockback: 2.3,
        hitRadiusBonus: 5,
        colorAccent: "#9effa1"
      },
      star: {
        damage: 12,
        knockback: 2.8,
        hitRadiusBonus: 1,
        colorAccent: "#ffe680"
      },
      diamond: {
        damage: 9,
        knockback: 2.5,
        hitRadiusBonus: 3,
        colorAccent: "#b7f0ff"
      }
    };

    /*
      ========================================
      7. コマ生成
      ========================================
    */
    function createSpinner(options) {
      const shape = SHAPE_TYPES[options.shapeType || "triangle"];

      return {
        x: options.x,
        y: options.y,
        vx: 0,
        vy: 0,
        radius: options.radius || 28,
        color: options.color || "skyblue",
        angle: 0,
        spinSpeed: options.spinSpeed || 0.22,
        movePower: options.movePower || 0.28,
        friction: options.friction || 0.985,
        maxSpeed: options.maxSpeed || 5.0,
        isCPU: options.isCPU || false,
        hitCooldown: 0,
        hp: options.hp || 100,
        maxHp: options.maxHp || 100,
        name: options.name || "spinner",
        shapeType: options.shapeType || "triangle",
        shapeDamage: shape.damage,
        shapeKnockback: shape.knockback,
        shapeHitRadiusBonus: shape.hitRadiusBonus,
        shapeAccent: shape.colorAccent,
        flashTimer: 0
      };
    }

    let player, cpu, gameOver;

    /*
      ========================================
      8. 初期化
      ========================================
    */
    function resetGame() {
      player = createSpinner({
        x: stage.x - 120,
        y: stage.y,
        color: "#4da6ff",
        name: "player",
        movePower: 0.30,
        maxSpeed: 5.4,
        spinSpeed: 0.24,
        hp: 100,
        maxHp: 100,
        shapeType: "star"
      });

      cpu = createSpinner({
        x: stage.x + 120,
        y: stage.y,
        color: "#ff6b6b",
        name: "cpu",
        isCPU: true,
        movePower: 0.31,
        maxSpeed: 5.3,
        spinSpeed: 0.26,
        hp: 100,
        maxHp: 100,
        shapeType: "diamond"
      });

      particles.length = 0;
      gameOver = false;
      messageBox.style.display = "none";
      updateHpUI();
    }

    resetGame();

    /*
      ========================================
      9. 補助関数
      ========================================
    */
    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function distance(ax, ay, bx, by) {
      return Math.hypot(bx - ax, by - ay);
    }

    function limitSpeed(obj) {
      const speed = Math.hypot(obj.vx, obj.vy);
      if (speed > obj.maxSpeed) {
        const rate = obj.maxSpeed / speed;
        obj.vx *= rate;
        obj.vy *= rate;
      }
    }

    function updateHpUI() {
      const playerRatio = (player.hp / player.maxHp) * 100;
      const cpuRatio = (cpu.hp / cpu.maxHp) * 100;

      playerHpText.textContent = `PLAYER HP: ${Math.ceil(player.hp)} / ${player.maxHp}`;
      cpuHpText.textContent = `CPU HP: ${Math.ceil(cpu.hp)} / ${cpu.maxHp}`;
      playerHpBar.style.width = `${playerRatio}%`;
      cpuHpBar.style.width = `${cpuRatio}%`;
    }

    /*
      ========================================
      10. プレイヤー操作
      ========================================
    */
    function updatePlayer(spinner) {
      if (keys["ArrowUp"]) spinner.vy -= spinner.movePower;
      if (keys["ArrowDown"]) spinner.vy += spinner.movePower;
      if (keys["ArrowLeft"]) spinner.vx -= spinner.movePower;
      if (keys["ArrowRight"]) spinner.vx += spinner.movePower;
    }

    /*
      ========================================
      11. CPU
      ========================================
    */
    function updateCPU(spinner, target) {
      const dx = target.x - spinner.x;
      const dy = target.y - spinner.y;
      const d = Math.hypot(dx, dy) || 1;

      const chaseX = (dx / d) * spinner.movePower * 0.90;
      const chaseY = (dy / d) * spinner.movePower * 0.90;

      const sideX = (-dy / d) * 0.05;
      const sideY = (dx / d) * 0.05;

      const centerDx = stage.x - spinner.x;
      const centerDy = stage.y - spinner.y;
      const centerDist = Math.hypot(centerDx, centerDy) || 1;

      let recoverX = 0;
      let recoverY = 0;

      if (centerDist > stage.radius * 0.72) {
        recoverX = (centerDx / centerDist) * 0.18;
        recoverY = (centerDy / centerDist) * 0.18;
      }

      spinner.vx += chaseX + sideX + recoverX;
      spinner.vy += chaseY + sideY + recoverY;
    }

    /*
      ========================================
      12. コマ更新
      ========================================
    */
    function updateSpinner(spinner) {
      spinner.x += spinner.vx;
      spinner.y += spinner.vy;

      spinner.vx *= spinner.friction;
      spinner.vy *= spinner.friction;

      spinner.angle += spinner.spinSpeed;

      limitSpeed(spinner);

      if (spinner.hitCooldown > 0) {
        spinner.hitCooldown--;
      }

      if (spinner.flashTimer > 0) {
        spinner.flashTimer--;
      }
    }

    /*
      ========================================
      13. 本体接触
      ========================================
      今回は「形の見た目」は違っても、
      判定は“本体の半径 + 形状ボーナス”で分かりやすく当てる
    */
    function handleShapeHit(a, b) {
      if (a.hitCooldown > 0 || gameOver) return;

      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const d = Math.hypot(dx, dy) || 1;

      const hitRange =
        a.radius + b.radius +
        a.shapeHitRadiusBonus +
        b.shapeHitRadiusBonus - 8;

      if (d < hitRange) {
        const nx = dx / d;
        const ny = dy / d;

        // 押し戻し
        const overlap = hitRange - d;
        a.x -= nx * overlap * 0.15;
        a.y -= ny * overlap * 0.15;
        b.x += nx * overlap * 0.15;
        b.y += ny * overlap * 0.15;

        // 弾き飛ばし
        b.vx += nx * a.shapeKnockback;
        b.vy += ny * a.shapeKnockback;

        // 攻撃側の反動
        a.vx -= nx * 0.25;
        a.vy -= ny * 0.25;

        // ダメージ
        b.hp -= a.shapeDamage;
        b.hp = clamp(b.hp, 0, b.maxHp);

        a.hitCooldown = 10;
        b.flashTimer = 6;

        const hitX = (a.x + b.x) / 2;
        const hitY = (a.y + b.y) / 2;

        spawnHitEffect(hitX, hitY, a.shapeAccent);
        playHitSound();
        updateHpUI();

        if (b.hp <= 0) {
          if (b === cpu) {
            endGame("YOU WIN");
          } else {
            endGame("YOU LOSE");
          }
        }
      }
    }

    /*
      ========================================
      14. リングアウト
      ========================================
    */
    function checkRingOut(spinner) {
      const dFromCenter = distance(spinner.x, spinner.y, stage.x, stage.y);
      return dFromCenter > stage.radius + spinner.radius;
    }

    /*
      ========================================
      15. 勝敗
      ========================================
    */
    function endGame(text) {
      if (gameOver) return;

      gameOver = true;
      messageText.textContent = text;
      messageBox.style.display = "flex";

      if (text === "YOU WIN") {
        playWinSound();
      } else {
        playLoseSound();
      }
    }

    /*
      ========================================
      16. 描画補助
      ========================================
    */
    function drawTriangle(radius) {
      ctx.beginPath();
      for (let i = 0; i < 3; i++) {
        const angle = -Math.PI / 2 + i * (Math.PI * 2 / 3);
        const x = Math.cos(angle) * radius;
        const y = Math.sin(angle) * radius;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
    }

    function drawSquare(radius) {
      ctx.beginPath();
      ctx.rect(-radius, -radius, radius * 2, radius * 2);
      ctx.fill();
    }

    function drawDiamond(radius) {
      ctx.beginPath();
      ctx.moveTo(0, -radius);
      ctx.lineTo(radius, 0);
      ctx.lineTo(0, radius);
      ctx.lineTo(-radius, 0);
      ctx.closePath();
      ctx.fill();
    }

    function drawStar(outerRadius, innerRadius, spikes = 5) {
      let rot = -Math.PI / 2;
      let step = Math.PI / spikes;

      ctx.beginPath();
      for (let i = 0; i < spikes; i++) {
        let x = Math.cos(rot) * outerRadius;
        let y = Math.sin(rot) * outerRadius;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
        rot += step;

        x = Math.cos(rot) * innerRadius;
        y = Math.sin(rot) * innerRadius;
        ctx.lineTo(x, y);
        rot += step;
      }
      ctx.closePath();
      ctx.fill();
    }

    /*
      ========================================
      17. 描画
      ========================================
    */
    function drawBackground() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const g = ctx.createRadialGradient(
        stage.x, stage.y, 40,
        stage.x, stage.y, Math.max(canvas.width, canvas.height)
      );
      g.addColorStop(0, "#2a2a2a");
      g.addColorStop(1, "#080808");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawStage() {
      ctx.beginPath();
      ctx.arc(stage.x, stage.y, stage.radius, 0, Math.PI * 2);
      ctx.fillStyle = "#404040";
      ctx.fill();

      ctx.beginPath();
      ctx.arc(stage.x, stage.y, stage.radius * 0.82, 0, Math.PI * 2);
      ctx.fillStyle = "#2d2d2d";
      ctx.fill();

      ctx.beginPath();
      ctx.arc(stage.x, stage.y, stage.radius, 0, Math.PI * 2);
      ctx.lineWidth = 10;
      ctx.strokeStyle = "#bdbdbd";
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(stage.x, stage.y, stage.radius * 0.20, 0, Math.PI * 2);
      ctx.lineWidth = 3;
      ctx.strokeStyle = "rgba(255,255,255,0.18)";
      ctx.stroke();
    }

    function drawSpinner(spinner) {
      ctx.save();
      ctx.translate(spinner.x, spinner.y);
      ctx.rotate(spinner.angle);

      // 影
      ctx.save();
      ctx.translate(4, 5);
      ctx.fillStyle = "rgba(0,0,0,0.28)";
      drawShape(spinner, true);
      ctx.restore();

      // 本体
      if (spinner.flashTimer > 0) {
        ctx.fillStyle = "#ffffff";
      } else {
        ctx.fillStyle = spinner.color;
      }
      drawShape(spinner, false);

      // 枠
      ctx.strokeStyle = "rgba(255,255,255,0.35)";
      ctx.lineWidth = 4;
      drawShapeStroke(spinner);

      // 中央
      ctx.beginPath();
      ctx.arc(0, 0, 8, 0, Math.PI * 2);
      ctx.fillStyle = "#ffffff";
      ctx.fill();

      ctx.restore();
    }

    function drawShape(spinner) {
      if (spinner.shapeType === "triangle") {
        drawTriangle(spinner.radius);
      } else if (spinner.shapeType === "square") {
        drawSquare(spinner.radius * 0.85);
      } else if (spinner.shapeType === "star") {
        drawStar(spinner.radius, spinner.radius * 0.48, 5);
      } else if (spinner.shapeType === "diamond") {
        drawDiamond(spinner.radius);
      }
    }

    function drawShapeStroke(spinner) {
      if (spinner.shapeType === "triangle") {
        ctx.beginPath();
        for (let i = 0; i < 3; i++) {
          const angle = -Math.PI / 2 + i * (Math.PI * 2 / 3);
          const x = Math.cos(angle) * spinner.radius;
          const y = Math.sin(angle) * spinner.radius;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      } else if (spinner.shapeType === "square") {
        ctx.beginPath();
        ctx.rect(-spinner.radius * 0.85, -spinner.radius * 0.85, spinner.radius * 1.7, spinner.radius * 1.7);
        ctx.stroke();
      } else if (spinner.shapeType === "star") {
        let rot = -Math.PI / 2;
        let step = Math.PI / 5;
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
          let x = Math.cos(rot) * spinner.radius;
          let y = Math.sin(rot) * spinner.radius;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
          rot += step;

          x = Math.cos(rot) * spinner.radius * 0.48;
          y = Math.sin(rot) * spinner.radius * 0.48;
          ctx.lineTo(x, y);
          rot += step;
        }
        ctx.closePath();
        ctx.stroke();
      } else if (spinner.shapeType === "diamond") {
        ctx.beginPath();
        ctx.moveTo(0, -spinner.radius);
        ctx.lineTo(spinner.radius, 0);
        ctx.lineTo(0, spinner.radius);
        ctx.lineTo(-spinner.radius, 0);
        ctx.closePath();
        ctx.stroke();
      }
    }

    /*
      ========================================
      18. 更新
      ========================================
    */
    function update() {
      if (gameOver) return;

      updatePlayer(player);
      updateCPU(cpu, player);

      updateSpinner(player);
      updateSpinner(cpu);

      handleShapeHit(player, cpu);
      handleShapeHit(cpu, player);

      updateParticles();

      if (checkRingOut(player)) {
        endGame("YOU LOSE");
      } else if (checkRingOut(cpu)) {
        endGame("YOU WIN");
      }
    }

    /*
      ========================================
      19. 描画
      ========================================
    */
    function draw() {
      drawBackground();
      drawStage();
      drawSpinner(player);
      drawSpinner(cpu);
      drawParticles();
    }

    /*
      ========================================
      20. メインループ
      ========================================
    */
    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
