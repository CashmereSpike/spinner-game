<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Top Battle Spinner - Improved</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .ui {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.45);
      padding: 12px 14px;
      border-radius: 10px;
      line-height: 1.6;
      font-size: 14px;
    }

    .message {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: rgba(0, 0, 0, 0.55);
      z-index: 20;
      text-align: center;
    }

    .message h1 {
      margin: 0 0 12px;
      font-size: 42px;
    }

    .message button {
      font-size: 18px;
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <div class="ui">
    <div><strong>操作方法</strong></div>
    <div>↑ ↓ ← → : 移動</div>
    <div>相手を武器で押し出して、ステージ外に落とす</div>
    <div id="hpText">HP - PLAYER: 100 / CPU: 100</div>
    <div>R : リスタート</div>
    <div>※ 最初のキー入力で音が有効になります</div>
  </div>

  <div class="message" id="messageBox">
    <h1 id="messageText">YOU WIN</h1>
    <button onclick="resetGame()">もう一回</button>
  </div>

  <canvas id="game"></canvas>

  <script>
    /*
      ========================================
      1. 基本設定
      ========================================
    */
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const messageBox = document.getElementById("messageBox");
    const messageText = document.getElementById("messageText");
    const hpText = document.getElementById("hpText");

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    /*
      ========================================
      2. キー入力
      ========================================
    */
    const keys = {};

    window.addEventListener("keydown", (e) => {
      keys[e.key] = true;

      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(e.key)) {
        e.preventDefault();
      }

      if (e.key === "r" || e.key === "R") {
        resetGame();
      }

      // ユーザー操作があった時点で音を有効化
      unlockAudio();
    });

    window.addEventListener("keyup", (e) => {
      keys[e.key] = false;
    });

    /*
      ========================================
      3. ステージ設定
      ========================================
    */
    const stage = {
      get x() {
        return canvas.width / 2;
      },
      get y() {
        return canvas.height / 2;
      },
      get radius() {
        return Math.min(canvas.width, canvas.height) * 0.34;
      }
    };

    /*
      ========================================
      4. 効果音
      ========================================
      外部ファイルを使わず、ブラウザ内で簡単な音を作る。
      GitHub Pagesでもそのまま動く。
    */
    let audioContext = null;
    let audioUnlocked = false;

    function unlockAudio() {
      if (audioUnlocked) return;

      try {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        audioUnlocked = true;
      } catch (err) {
        console.log("Audio not available:", err);
      }
    }

    // 短い電子音を鳴らす関数
    function playBeep(freq = 440, duration = 0.06, type = "square", volume = 0.03) {
      if (!audioUnlocked || !audioContext) return;

      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();

      osc.type = type;
      osc.frequency.value = freq;

      gain.gain.value = volume;
      gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + duration);

      osc.connect(gain);
      gain.connect(audioContext.destination);

      osc.start();
      osc.stop(audioContext.currentTime + duration);
    }

    function playHitSound() {
      playBeep(220, 0.05, "sawtooth", 0.04);
      setTimeout(() => playBeep(160, 0.05, "square", 0.03), 20);
    }

    function playWinSound() {
      playBeep(523, 0.08, "square", 0.04);
      setTimeout(() => playBeep(659, 0.08, "square", 0.04), 100);
      setTimeout(() => playBeep(784, 0.14, "square", 0.05), 200);
    }

    function playLoseSound() {
      playBeep(300, 0.08, "triangle", 0.04);
      setTimeout(() => playBeep(220, 0.10, "triangle", 0.04), 100);
      setTimeout(() => playBeep(160, 0.14, "triangle", 0.05), 220);
    }

    /*
      ========================================
      5. エフェクト用の粒
      ========================================
      ヒットした場所に小さな火花を出す。
    */
    const particles = [];

    function spawnHitEffect(x, y, color = "#ffd54f") {
      for (let i = 0; i < 12; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 3;

        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 24 + Math.floor(Math.random() * 10),
          maxLife: 24 + Math.floor(Math.random() * 10),
          size: 2 + Math.random() * 3,
          color
        });
      }
    }
