<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Spinner Arena - Spectator Mode</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #05070d;
      color: white;
    }

    body {
      position: relative;
    }

    canvas {
      display: block;
    }

    .hud {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 12px 18px;
      border-radius: 18px;
      background: rgba(5, 8, 20, 0.55);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow:
        0 0 24px rgba(0, 200, 255, 0.12),
        inset 0 0 18px rgba(255,255,255,0.04);
      user-select: none;
    }

    .team {
      min-width: 170px;
      text-align: center;
    }

    .team .name {
      font-size: 12px;
      opacity: 0.8;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .team .score {
      font-size: 28px;
      font-weight: 800;
      line-height: 1;
    }

    .vs {
      font-size: 18px;
      font-weight: 700;
      opacity: 0.85;
      letter-spacing: 2px;
    }

    .blue {
      color: #67c6ff;
      text-shadow: 0 0 18px rgba(103, 198, 255, 0.65);
    }

    .red {
      color: #ff7474;
      text-shadow: 0 0 18px rgba(255, 116, 116, 0.65);
    }

    .status {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(7, 11, 26, 0.6);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(8px);
      font-size: 13px;
      letter-spacing: 0.8px;
      opacity: 0.92;
      user-select: none;
    }

    .result {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 25;
    }

    .resultText {
      font-size: min(9vw, 72px);
      font-weight: 900;
      letter-spacing: 4px;
      opacity: 0;
      transform: scale(0.9);
      transition: 0.25s ease;
      text-transform: uppercase;
      text-align: center;
      text-shadow:
        0 0 20px rgba(255,255,255,0.12),
        0 0 40px rgba(255,255,255,0.08);
    }

    .resultText.show {
      opacity: 1;
      transform: scale(1);
    }

    .controls {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 20;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(8, 12, 26, 0.52);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(8px);
      font-size: 12px;
      line-height: 1.6;
      opacity: 0.92;
      user-select: none;
    }

    .controls b {
      color: #dfe8ff;
    }
  </style>
</head>
<body>
  <div class="controls">
    <div><b>観戦モード</b></div>
    <div>R : スコア込みで再起動</div>
    <div>M : 音のON/OFF</div>
    <div>※ 最初のキー入力で音が有効</div>
  </div>

  <div class="hud">
    <div class="team">
      <div class="name blue">Blue Spinner</div>
      <div class="score blue" id="blueScore">0</div>
    </div>
    <div class="vs">VS</div>
    <div class="team">
      <div class="name red">Red Spinner</div>
      <div class="score red" id="redScore">0</div>
    </div>
  </div>

  <div class="status" id="statusText">AUTO BATTLE / NEXT ROUND CONTINUES AUTOMATICALLY</div>

  <div class="result">
    <div class="resultText" id="resultText">BLUE WIN</div>
  </div>

  <canvas id="game"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const blueScoreEl = document.getElementById("blueScore");
    const redScoreEl = document.getElementById("redScore");
    const statusText = document.getElementById("statusText");
    const resultText = document.getElementById("resultText");

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    // =========================
    // Audio
    // =========================
    let audioContext = null;
    let audioUnlocked = false;
    let muted = false;

    function unlockAudio() {
      if (audioUnlocked) return;
      try {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        audioUnlocked = true;
      } catch (e) {
        console.log("Audio unavailable", e);
      }
    }

    function playBeep(freq = 440, duration = 0.06, type = "square", volume = 0.03) {
      if (!audioUnlocked || !audioContext || muted) return;

      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();

      osc.type = type;
      osc.frequency.value = freq;

      gain.gain.value = volume;
      gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + duration);

      osc.connect(gain);
      gain.connect(audioContext.destination);

      osc.start();
      osc.stop(audioContext.currentTime + duration);
    }

    function playHitSound() {
      playBeep(240, 0.045, "sawtooth", 0.045);
      setTimeout(() => playBeep(170, 0.04, "square", 0.03), 18);
    }

    function playRoundWinSound(isBlue) {
      if (isBlue) {
        playBeep(523, 0.08, "square", 0.05);
        setTimeout(() => playBeep(659, 0.08, "square", 0.05), 80);
        setTimeout(() => playBeep(784, 0.14, "square", 0.06), 170);
      } else {
        playBeep(392, 0.08, "triangle", 0.05);
        setTimeout(() => playBeep(494, 0.08, "triangle", 0.05), 80);
        setTimeout(() => playBeep(659, 0.14, "triangle", 0.06), 170);
      }
    }

    window.addEventListener("keydown", (e) => {
      unlockAudio();

      if (e.key === "r" || e.key === "R") {
        blueScore = 0;
        redScore = 0;
        updateScoreUI();
        startRound();
      }

      if (e.key === "m" || e.key === "M") {
        muted = !muted;
        statusText.textContent = muted
          ? "AUTO BATTLE / SOUND OFF"
          : "AUTO BATTLE / SOUND ON";
      }
    });

    // =========================
    // Stage
    // =========================
    const stage = {
      get x() { return canvas.width / 2; },
      get y() { return canvas.height / 2; },
      get radius() { return Math.min(canvas.width, canvas.height) * 0.33; }
    };

    // =========================
    // Effects
    // =========================
    const particles = [];
    const shockRings = [];
    const stars = [];

    function initStars() {
      stars.length = 0;
      const count = Math.min(160, Math.floor((canvas.width * canvas.height) / 12000));
      for (let i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: Math.random() * 1.8 + 0.3,
          a: Math.random() * 0.6 + 0.15,
          tw: Math.random() * 0.03 + 0.01
        });
      }
    }
    initStars();
    window.addEventListener("resize", initStars);

    function spawnHitEffect(x, y, color) {
      for (let i = 0; i < 16; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.2 + Math.random() * 4.2;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 18 + Math.random() * 16,
          maxLife: 18 + Math.random() * 16,
          size: 1.5 + Math.random() * 3.5,
          color
        });
      }

      shockRings.push({
        x, y,
        r: 8,
        maxR: 34 + Math.random() * 18,
        life: 18,
        maxLife: 18,
        color
      });
    }

    function spawnRingOutEffect(spinner) {
      for (let i = 0; i < 34; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 6;
        particles.push({
          x: spinner.x,
          y: spinner.y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 28 + Math.random() * 18,
          maxLife: 28 + Math.random() * 18,
          size: 2 + Math.random() * 5,
          color: spinner.glow
        });
      }
    }

    function updateEffects() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.975;
        p.vy *= 0.975;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }

      for (let i = shockRings.length - 1; i >= 0; i--) {
        const s = shockRings[i];
        s.r += (s.maxR - s.r) * 0.22;
        s.life--;
        if (s.life <= 0) shockRings.splice(i, 1);
      }
    }

    // =========================
    // Utilities
    // =========================
    function distance(ax, ay, bx, by) {
      return Math.hypot(bx - ax, by - ay);
    }

    function clampSpeed(obj) {
      const speed = Math.hypot(obj.vx, obj.vy);
      if (speed > obj.maxSpeed) {
        const rate = obj.maxSpeed / speed;
        obj.vx *= rate;
        obj.vy *= rate;
      }
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function getWeaponTip(spinner) {
      const length = spinner.radius + spinner.weaponLength;
      return {
        x: spinner.x + Math.cos(spinner.angle) * length,
        y: spinner.y + Math.sin(spinner.angle) * length
      };
    }

    // =========================
    // Spinners
    // =========================
    function createSpinner(opt) {
      return {
        x: opt.x,
        y: opt.y,
        vx: 0,
        vy: 0,
        radius: opt.radius ?? 26,
        color: opt.color,
        glow: opt.glow,
        weaponColor: opt.weaponColor,
        weaponLength: opt.weaponLength ?? 31,
        weaponWidth: opt.weaponWidth ?? 10,
        angle: Math.random() * Math.PI * 2,
        spinSpeed: opt.spinSpeed ?? 0.25,
        movePower: opt.movePower ?? 0.29,
        friction: opt.friction ?? 0.988,
        maxSpeed: opt.maxSpeed ?? 5.8,
        hitCooldown: 0,
        boostCooldown: 0,
        trail: [],
        wobble: Math.random() * Math.PI * 2,
        name: opt.name
      };
    }

    let blue, red;
    let gameOver = false;
    let roundTimer = 0;
    let blueScore = 0;
    let redScore = 0;

    function startRound() {
      blue = createSpinner({
        x: stage.x - 130,
        y: stage.y + (Math.random() * 80 - 40),
        color: "#52b8ff",
        glow: "rgba(82,184,255,0.95)",
        weaponColor: "#d8f3ff",
        name: "BLUE",
        movePower: 0.31,
        maxSpeed: 5.8,
        spinSpeed: 0.27
      });

      red = createSpinner({
        x: stage.x + 130,
        y: stage.y + (Math.random() * 80 - 40),
        color: "#ff5f6d",
        glow: "rgba(255,95,109,0.95)",
        weaponColor: "#ffe3a6",
        name: "RED",
        movePower: 0.315,
        maxSpeed: 5.9,
        spinSpeed: 0.275
      });

      particles.length = 0;
      shockRings.length = 0;
      gameOver = false;
      roundTimer = 0;
      resultText.classList.remove("show");
      statusText.textContent = "AUTO BATTLE / NEXT ROUND CONTINUES AUTOMATICALLY";
    }

    function updateScoreUI() {
      blueScoreEl.textContent = blueScore;
      redScoreEl.textContent = redScore;
    }

    startRound();
    updateScoreUI();

    // =========================
    // AI
    // =========================
    function updateAI(spinner, enemy) {
      const dx = enemy.x - spinner.x;
      const dy = enemy.y - spinner.y;
      const d = Math.hypot(dx, dy) || 1;

      const nx = dx / d;
      const ny = dy / d;

      const tangentX = -ny;
      const tangentY = nx;

      const distFromCenter = distance(spinner.x, spinner.y, stage.x, stage.y);
      const centerDx = stage.x - spinner.x;
      const centerDy = stage.y - spinner.y;
      const centerDist = Math.hypot(centerDx, centerDy) || 1;

      let pursue = 1.0;
      let circle = Math.sin(performance.now() * 0.0018 + spinner.wobble) * 0.12;
      let recover = 0;

      if (distFromCenter > stage.radius * 0.72) {
        recover = 0.34;
        pursue = 0.72;
      }

      // 近距離では一気に押し込みやすくする
      if (d < 120 && spinner.boostCooldown <= 0) {
        spinner.vx += nx * 1.2;
        spinner.vy += ny * 1.2;
        spinner.boostCooldown = 55 + Math.floor(Math.random() * 25);
      }

      spinner.vx += nx * spinner.movePower * pursue;
      spinner.vy += ny * spinner.movePower * pursue;

      spinner.vx += tangentX * circle;
      spinner.vy += tangentY * circle;

      spinner.vx += (centerDx / centerDist) * recover;
      spinner.vy += (centerDy / centerDist) * recover;

      // 相手が外周なら押し出し優先
      const enemyEdgeDist = distance(enemy.x, enemy.y, stage.x, stage.y);
      if (enemyEdgeDist > stage.radius * 0.68) {
        spinner.vx += nx * 0.16;
        spinner.vy += ny * 0.16;
      }

      if (spinner.boostCooldown > 0) spinner.boostCooldown--;
    }

    function updateSpinner(spinner) {
      spinner.x += spinner.vx;
      spinner.y += spinner.vy;

      spinner.vx *= spinner.friction;
      spinner.vy *= spinner.friction;

      spinner.angle += spinner.spinSpeed;
      clampSpeed(spinner);

      if (spinner.hitCooldown > 0) spinner.hitCooldown--;

      spinner.trail.push({
        x: spinner.x,
        y: spinner.y,
        a: spinner.angle
      });
      if (spinner.trail.length > 10) spinner.trail.shift();
    }

    function resolveBodyCollision(a, b) {
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const d = Math.hypot(dx, dy);
      const minDist = a.radius + b.radius;

      if (d > 0 && d < minDist) {
        const overlap = minDist - d;
        const nx = dx / d;
        const ny = dy / d;

        a.x -= nx * overlap * 0.5;
        a.y -= ny * overlap * 0.5;
        b.x += nx * overlap * 0.5;
        b.y += ny * overlap * 0.5;

        a.vx -= nx * 0.28;
        a.vy -= ny * 0.28;
        b.vx += nx * 0.28;
        b.vy += ny * 0.28;

        spawnHitEffect((a.x + b.x) / 2, (a.y + b.y) / 2, "#ffffff");
        playHitSound();
      }
    }

    function handleWeaponHit(attacker, defender) {
      if (attacker.hitCooldown > 0) return;

      const tip = getWeaponTip(attacker);
      const d = distance(tip.x, tip.y, defender.x, defender.y);

      if (d < defender.radius + attacker.weaponWidth + 1) {
        const dx = defender.x - attacker.x;
        const dy = defender.y - attacker.y;
        const len = Math.hypot(dx, dy) || 1;
        const nx = dx / len;
        const ny = dy / len;

        defender.vx += nx * 3.0;
        defender.vy += ny * 3.0;

        attacker.vx -= nx * 0.42;
        attacker.vy -= ny * 0.42;

        // 回転方向の勢いも少し足す
        defender.vx += Math.cos(attacker.angle) * 0.4;
        defender.vy += Math.sin(attacker.angle) * 0.4;

        attacker.hitCooldown = 10;

        spawnHitEffect(tip.x, tip.y, attacker.glow);
        playHitSound();
      }
    }

    function checkRingOut(spinner) {
      const d = distance(spinner.x, spinner.y, stage.x, stage.y);
      return d > stage.radius + spinner.radius;
    }

    function endRound(winner, loser) {
      if (gameOver) return;
      gameOver = true;

      spawnRingOutEffect(loser);

      if (winner === blue) {
        blueScore++;
        resultText.textContent = "BLUE WIN";
        resultText.style.color = "#67c6ff";
        resultText.style.textShadow = "0 0 24px rgba(103,198,255,0.9), 0 0 60px rgba(103,198,255,0.35)";
        playRoundWinSound(true);
      } else {
        redScore++;
        resultText.textContent = "RED WIN";
        resultText.style.color = "#ff7b7b";
        resultText.style.textShadow = "0 0 24px rgba(255,123,123,0.9), 0 0 60px rgba(255,123,123,0.35)";
        playRoundWinSound(false);
      }

      updateScoreUI();
      resultText.classList.add("show");
      statusText.textContent = "RING OUT / NEXT ROUND STARTS SOON";
    }

    // =========================
    // Draw
    // =========================
    function drawBackground() {
      const g = ctx.createRadialGradient(
        stage.x, stage.y, 0,
        stage.x, stage.y, Math.max(canvas.width, canvas.height) * 0.85
      );
      g.addColorStop(0, "#0e1730");
      g.addColorStop(0.35, "#0a0f1d");
      g.addColorStop(0.7, "#05070d");
      g.addColorStop(1, "#020308");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (const s of stars) {
        s.a += s.tw;
        const alpha = 0.18 + (Math.sin(s.a) * 0.5 + 0.5) * 0.55;
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = "#b7d3ff";
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function drawStage() {
      // Outer glow
      ctx.beginPath();
      ctx.arc(stage.x, stage.y, stage.radius + 18, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(54, 132, 255, 0.05)";
      ctx.fill();

      // Main arena
      const ringGrad = ctx.createRadialGradient(
        stage.x, stage.y, stage.radius * 0.15,
        stage.x, stage.y, stage.radius
      );
      ringGrad.addColorStop(0, "#141c33");
      ringGrad.addColorStop(0.5, "#101625");
      ringGrad.addColorStop(1, "#0a0e17");

      ctx.beginPath();
      ctx.arc(stage.x, stage.y, stage.radius, 0, Math.PI * 2);
      ctx.fillStyle = ringGrad;
      ctx.fill();

      // Inner circles
      for (let i = 1; i <= 4; i++) {
        ctx.beginPath();
        ctx.arc(stage.x, stage.y, stage.radius * (i / 4.8), 0, Math.PI * 2);
        ctx.lineWidth = i === 4 ? 3 : 1.2;
        ctx.strokeStyle = i === 4
          ? "rgba(120,190,255,0.35)"
          : "rgba(255,255,255,0.08)";
        ctx.stroke();
      }

      // Hex-ish accent lines
      for (let i = 0; i < 6; i++) {
        const a = (Math.PI * 2 / 6) * i + performance.now() * 0.00015;
        const x1 = stage.x + Math.cos(a) * stage.radius * 0.22;
        const y1 = stage.y + Math.sin(a) * stage.radius * 0.22;
        const x2 = stage.x + Math.cos(a) * stage.radius * 0.92;
        const y2 = stage.y + Math.sin(a) * stage.radius * 0.92;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = "rgba(120,190,255,0.08)";
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      // Edge ring
      ctx.beginPath();
      ctx.arc(stage.x, stage.y, stage.radius, 0, Math.PI * 2);
      ctx.lineWidth = 8;
      ctx.strokeStyle = "rgba(147, 203, 255, 0.55)";
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(stage.x, stage.y, stage.radius - 8, 0, Math.PI * 2);
      ctx.lineWidth = 2;
      ctx.strokeStyle = "rgba(255,255,255,0.08)";
      ctx.stroke();
    }

    function drawTrail(spinner) {
      for (let i = 0; i < spinner.trail.length; i++) {
        const t = spinner.trail[i];
        const alpha = i / spinner.trail.length * 0.25;
        const r = spinner.radius * (0.74 + i / spinner.trail.length * 0.22);

        ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.arc(t.x, t.y, r, 0, Math.PI * 2);
        ctx.fillStyle = spinner.glow;
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function drawSpinner(spinner) {
      drawTrail(spinner);

      ctx.save();
      ctx.translate(spinner.x, spinner.y);
      ctx.rotate(spinner.angle);

      // shadow glow
      ctx.beginPath();
      ctx.arc(0, 0, spinner.radius + 10, 0, Math.PI * 2);
      ctx.fillStyle = spinner.glow.replace("0.95", "0.12");
      ctx.fill();

      // body glow
      ctx.shadowBlur = 24;
      ctx.shadowColor = spinner.glow;

      // outer body
      const grad = ctx.createRadialGradient(-6, -8, 4, 0, 0, spinner.radius);
      grad.addColorStop(0, "#ffffff");
      grad.addColorStop(0.18, spinner.color);
      grad.addColorStop(0.7, spinner.color);
      grad.addColorStop(1, "rgba(0,0,0,0.9)");

      ctx.beginPath();
      ctx.arc(0, 0, spinner.radius, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();

      // ring
      ctx.lineWidth = 4;
      ctx.strokeStyle = "rgba(255,255,255,0.42)";
      ctx.stroke();

      // rotating weapon arm
      ctx.fillStyle = spinner.weaponColor;
      ctx.fillRect(
        spinner.radius - 2,
        -spinner.weaponWidth / 2,
        spinner.weaponLength,
        spinner.weaponWidth
      );

      // weapon glow
      ctx.beginPath();
      ctx.arc(
        spinner.radius + spinner.weaponLength,
        0,
        spinner.weaponWidth * 0.62,
        0,
        Math.PI * 2
      );
      ctx.fillStyle = "#ffffff";
      ctx.fill();

      // extra blade accent
      ctx.beginPath();
      ctx.moveTo(spinner.radius + 5, -spinner.weaponWidth * 0.9);
      ctx.lineTo(spinner.radius + spinner.weaponLength + 8, 0);
      ctx.lineTo(spinner.radius + 5, spinner.weaponWidth * 0.9);
      ctx.closePath();
      ctx.globalAlpha = 0.38;
      ctx.fillStyle = spinner.weaponColor;
      ctx.fill();
      ctx.globalAlpha = 1;

      // core
      ctx.shadowBlur = 16;
      ctx.beginPath();
      ctx.arc(0, 0, 8.5, 0, Math.PI * 2);
      ctx.fillStyle = "#ffffff";
      ctx.fill();

      ctx.beginPath();
      ctx.arc(0, 0, 3.5, 0, Math.PI * 2);
      ctx.fillStyle = "#0b1020";
      ctx.fill();

      ctx.restore();
      ctx.shadowBlur = 0;
    }

    function drawEffects() {
      for (const p of particles) {
        const alpha = p.life / p.maxLife;
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
      }

      for (const s of shockRings) {
        const alpha = s.life / s.maxLife;
        ctx.globalAlpha = alpha * 0.7;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.lineWidth = 3;
        ctx.strokeStyle = s.color;
        ctx.stroke();
      }

      ctx.globalAlpha = 1;
    }

    // =========================
    // Update
    // =========================
    function update() {
      updateEffects();

      if (gameOver) {
        roundTimer++;
        if (roundTimer > 120) {
          startRound();
        }
        return;
      }

      updateAI(blue, red);
      updateAI(red, blue);

      updateSpinner(blue);
      updateSpinner(red);

      resolveBodyCollision(blue, red);
      handleWeaponHit(blue, red);
      handleWeaponHit(red, blue);

      if (checkRingOut(blue)) {
        endRound(red, blue);
      } else if (checkRingOut(red)) {
        endRound(blue, red);
      }
    }

    function draw() {
      drawBackground();
      drawStage();
      drawSpinner(blue);
      drawSpinner(red);
      drawEffects();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
