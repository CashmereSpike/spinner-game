<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Top Battle Spinner - Weapon Hit Fix</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .ui {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.55);
      padding: 12px 14px;
      border-radius: 12px;
      line-height: 1.6;
      font-size: 14px;
      min-width: 280px;
    }

    .bar-wrap {
      margin-top: 8px;
      margin-bottom: 8px;
    }

    .bar-label {
      font-size: 12px;
      margin-bottom: 4px;
    }

    .bar-bg {
      width: 220px;
      height: 14px;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .bar-fill {
      height: 100%;
      width: 100%;
      transition: width 0.08s linear;
    }

    #playerHpBar {
      background: #4da6ff;
    }

    #cpuHpBar {
      background: #ff6b6b;
    }

    .message {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: rgba(0, 0, 0, 0.55);
      z-index: 20;
      text-align: center;
    }

    .message h1 {
      margin: 0 0 12px;
      font-size: 42px;
    }

    .message button {
      font-size: 18px;
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <div class="ui">
    <div><strong>操作方法</strong></div>
    <div>↑ ↓ ← → : 移動</div>
    <div>R : リスタート</div>
    <div>武器を当てて相手を弾く / HPを削る</div>
    <div>プレイヤー武器: <strong>blade</strong></div>
    <div>CPU武器: <strong>spear</strong></div>

    <div class="bar-wrap">
      <div class="bar-label" id="playerHpText">PLAYER HP: 100 / 100</div>
      <div class="bar-bg">
        <div class="bar-fill" id="playerHpBar"></div>
      </div>
    </div>

    <div class="bar-wrap">
      <div class="bar-label" id="cpuHpText">CPU HP: 100 / 100</div>
      <div class="bar-bg">
        <div class="bar-fill" id="cpuHpBar"></div>
      </div>
    </div>

    <div>※ 最初のキー入力で音が有効になります</div>
  </div>

  <div class="message" id="messageBox">
    <h1 id="messageText">YOU WIN</h1>
    <button onclick="resetGame()">もう一回</button>
  </div>

  <canvas id="game"></canvas>

  <script>
    /*
      ========================================
      1. 基本設定
      ========================================
    */
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const messageBox = document.getElementById("messageBox");
    const messageText = document.getElementById("messageText");

    const playerHpText = document.getElementById("playerHpText");
    const cpuHpText = document.getElementById("cpuHpText");
    const playerHpBar = document.getElementById("playerHpBar");
    const cpuHpBar = document.getElementById("cpuHpBar");

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    /*
      ========================================
      2. キー入力
      ========================================
    */
    const keys = {};

    window.addEventListener("keydown", (e) => {
      keys[e.key] = true;

      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(e.key)) {
        e.preventDefault();
      }

      if (e.key === "r" || e.key === "R") {
        resetGame();
      }

      unlockAudio();
    });

    window.addEventListener("keyup", (e) => {
      keys[e.key] = false;
    });

    /*
      ========================================
      3. ステージ
      ========================================
    */
    const stage = {
      get x() {
        return canvas.width / 2;
      },
      get y() {
        return canvas.height / 2;
      },
      get radius() {
        return Math.min(canvas.width, canvas.height) * 0.34;
      }
    };

    /*
      ========================================
      4. 効果音
      ========================================
    */
    let audioContext = null;
    let audioUnlocked = false;

    function unlockAudio() {
      if (audioUnlocked) return;
      try {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        audioUnlocked = true;
      } catch (err) {
        console.log("Audio not available:", err);
      }
    }

    function playBeep(freq = 440, duration = 0.06, type = "square", volume = 0.03) {
      if (!audioUnlocked || !audioContext) return;

      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();

      osc.type = type;
      osc.frequency.value = freq;

      gain.gain.value = volume;
      gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + duration);

      osc.connect(gain);
      gain.connect(audioContext.destination);

      osc.start();
      osc.stop(audioContext.currentTime + duration);
    }

    function playHitSound() {
      playBeep(220, 0.04, "sawtooth", 0.04);
      setTimeout(() => playBeep(170, 0.04, "square", 0.03), 15);
    }

    function playWinSound() {
      playBeep(523, 0.08, "square", 0.04);
      setTimeout(() => playBeep(659, 0.08, "square", 0.04), 100);
      setTimeout(() => playBeep(784, 0.14, "square", 0.05), 200);
    }

    function playLoseSound() {
      playBeep(300, 0.08, "triangle", 0.04);
      setTimeout(() => playBeep(220, 0.10, "triangle", 0.04), 100);
      setTimeout(() => playBeep(160, 0.14, "triangle", 0.05), 220);
    }

    /*
      ========================================
      5. エフェクト
      ========================================
    */
    const particles = [];

    function spawnHitEffect(x, y, color = "#ffd54f") {
      for (let i = 0; i < 14; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 3.2;

        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 20 + Math.floor(Math.random() * 12),
          maxLife: 20 + Math.floor(Math.random() * 12),
          size: 2 + Math.random() * 3,
          color
        });
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.97;
        p.vy *= 0.97;
        p.life--;

        if (p.life <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    function drawParticles() {
      for (const p of particles) {
        const alpha = p.life / p.maxLife;
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    /*
      ========================================
      6. 武器タイプ
      ========================================
    */
    const WEAPON_TYPES = {
      blade: {
        length: 28,
        width: 10,
        damage: 8,
        knockback: 2.5,
        color: "#ffd54f"
      },
      hammer: {
        length: 18,
        width: 18,
        damage: 12,
        knockback: 3.2,
        color: "#ffb347"
      },
      spear: {
        length: 40,
        width: 7,
        damage: 7,
        knockback: 2.2,
        color: "#b7f0ff"
      }
    };

    /*
      ========================================
      7. コマ生成
      ========================================
    */
    function createSpinner(options) {
      const weapon = WEAPON_TYPES[options.weaponType || "blade"];

      return {
        x: options.x,
        y: options.y,
        vx: 0,
        vy: 0,
        radius: options.radius || 26,
        color: options.color || "skyblue",
        angle: 0,
        spinSpeed: options.spinSpeed || 0.22,
        movePower: options.movePower || 0.28,
        friction: options.friction || 0.985,
        maxSpeed: options.maxSpeed || 5.0,
        isCPU: options.isCPU || false,
        hitCooldown: 0,
        hp: options.hp || 100,
        maxHp: options.maxHp || 100,
        name: options.name || "spinner",
        weaponType: options.weaponType || "blade",
        weaponLength: weapon.length,
        weaponWidth: weapon.width,
        weaponDamage: weapon.damage,
        weaponKnockback: weapon.knockback,
        weaponColor: weapon.color
      };
    }

    let player, cpu, gameOver;

    /*
      ========================================
      8. 初期化
      ========================================
    */
    function resetGame() {
      player = createSpinner({
        x: stage.x - 120,
        y: stage.y,
        color: "#4da6ff",
        name: "player",
        movePower: 0.30,
        maxSpeed: 5.4,
        spinSpeed: 0.24,
        hp: 100,
        maxHp: 100,
        weaponType: "blade"
      });

      cpu = createSpinner({
        x: stage.x + 120,
        y: stage.y,
        color: "#ff6b6b",
        name: "cpu",
        isCPU: true,
        movePower: 0.31,
        maxSpeed: 5.3,
        spinSpeed: 0.26,
        hp: 100,
        maxHp: 100,
        weaponType: "spear"
      });

      particles.length = 0;
      gameOver = false;
      messageBox.style.display = "none";
      updateHpUI();
    }

    resetGame();

    /*
      ========================================
      9. 補助関数
      ========================================
    */
    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function distance(ax, ay, bx, by) {
      return Math.hypot(bx - ax, by - ay);
    }

    function limitSpeed(obj) {
      const speed = Math.hypot(obj.vx, obj.vy);
      if (speed > obj.maxSpeed) {
        const rate = obj.maxSpeed / speed;
        obj.vx *= rate;
        obj.vy *= rate;
      }
    }

    function updateHpUI() {
      const playerRatio = (player.hp / player.maxHp) * 100;
      const cpuRatio = (cpu.hp / cpu.maxHp) * 100;

      playerHpText.textContent = `PLAYER HP: ${Math.ceil(player.hp)} / ${player.maxHp}`;
      cpuHpText.textContent = `CPU HP: ${Math.ceil(cpu.hp)} / ${cpu.maxHp}`;
      playerHpBar.style.width = `${playerRatio}%`;
      cpuHpBar.style.width = `${cpuRatio}%`;
    }

    /*
      武器の上に複数の当たり点を置く。
      これで「武器に当たったのに反応しない」を減らす。
    */
    function getWeaponHitPoints(spinner) {
      const points = [];
      const count = 6;

      for (let i = 0; i < count; i++) {
        const t = i / (count - 1);

        const dist = (spinner.radius - 2) + spinner.weaponLength * t;

        points.push({
          x: spinner.x + Math.cos(spinner.angle) * dist,
          y: spinner.y + Math.sin(spinner.angle) * dist
        });
      }

      return points;
    }

    /*
      ========================================
      10. プレイヤー操作
      ========================================
    */
    function updatePlayer(spinner) {
      if (keys["ArrowUp"]) spinner.vy -= spinner.movePower;
      if (keys["ArrowDown"]) spinner.vy += spinner.movePower;
      if (keys["ArrowLeft"]) spinner.vx -= spinner.movePower;
      if (keys["ArrowRight"]) spinner.vx += spinner.movePower;
    }

    /*
      ========================================
      11. CPU
      ========================================
    */
    function updateCPU(spinner, target) {
      const dx = target.x - spinner.x;
      const dy = target.y - spinner.y;
      const d = Math.hypot(dx, dy) || 1;

      const chaseX = (dx / d) * spinner.movePower * 0.90;
      const chaseY = (dy / d) * spinner.movePower * 0.90;

      const sideX = (-dy / d) * 0.05;
      const sideY = (dx / d) * 0.05;

      const centerDx = stage.x - spinner.x;
      const centerDy = stage.y - spinner.y;
      const centerDist = Math.hypot(centerDx, centerDy) || 1;

      let recoverX = 0;
      let recoverY = 0;

      if (centerDist > stage.radius * 0.72) {
        recoverX = (centerDx / centerDist) * 0.18;
        recoverY = (centerDy / centerDist) * 0.18;
      }

      spinner.vx += chaseX + sideX + recoverX;
      spinner.vy += chaseY + sideY + recoverY;
    }

    /*
      ========================================
      12. コマ更新
      ========================================
    */
    function updateSpinner(spinner) {
      spinner.x += spinner.vx;
      spinner.y += spinner.vy;

      spinner.vx *= spinner.friction;
      spinner.vy *= spinner.friction;

      spinner.angle += spinner.spinSpeed;

      limitSpeed(spinner);

      if (spinner.hitCooldown > 0) {
        spinner.hitCooldown--;
      }
    }

    /*
      ========================================
      13. 本体接触
      ========================================
    */
    function resolveBodyCollision(a, b) {
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const d = Math.hypot(dx, dy);
      const minDist = a.radius + b.radius;

      if (d > 0 && d < minDist) {
        const overlap = minDist - d;
        const nx = dx / d;
        const ny = dy / d;

        a.x -= nx * overlap * 0.5;
        a.y -= ny * overlap * 0.5;
        b.x += nx * overlap * 0.5;
        b.y += ny * overlap * 0.5;

        a.vx -= nx * 0.15;
        a.vy -= ny * 0.15;
        b.vx += nx * 0.15;
        b.vy += ny * 0.15;
      }
    }

    /*
      ========================================
      14. 武器ヒット
      ========================================
      武器の複数点のどれかが相手の円に入ったらヒット。
      ヒットしたら相手を弾く。
    */
    function handleWeaponHit(attacker, defender) {
      if (attacker.hitCooldown > 0 || gameOver) return;

      const hitPoints = getWeaponHitPoints(attacker);
      let hitPoint = null;

      for (const p of hitPoints) {
        const d = distance(p.x, p.y, defender.x, defender.y);

        if (d < defender.radius + attacker.weaponWidth * 0.55) {
          hitPoint = p;
          break;
        }
      }

      if (!hitPoint) return;

      // 攻撃方向は「攻撃者の中心 → 相手の中心」
      const dx = defender.x - attacker.x;
      const dy = defender.y - attacker.y;
      const len = Math.hypot(dx, dy) || 1;

      const nx = dx / len;
      const ny = dy / len;

      // 相手をしっかり弾く
      defender.vx += nx * attacker.weaponKnockback;
      defender.vy += ny * attacker.weaponKnockback;

      // 攻撃側に少し反動
      attacker.vx -= nx * 0.28;
      attacker.vy -= ny * 0.28;

      // HP減少
      defender.hp -= attacker.weaponDamage;
      defender.hp = clamp(defender.hp, 0, defender.maxHp);

      attacker.hitCooldown = 10;

      spawnHitEffect(hitPoint.x, hitPoint.y, attacker.weaponColor);
      playHitSound();
      updateHpUI();

      if (defender.hp <= 0) {
        if (defender === cpu) {
          endGame("YOU WIN");
        } else {
          endGame("YOU LOSE");
        }
      }
    }

    /*
      ========================================
      15. リングアウト
      ========================================
    */
    function checkRingOut(spinner) {
      const dFromCenter = distance(spinner.x, spinner.y, stage.x, stage.y);
      return dFromCenter > stage.radius + spinner.radius;
    }

    /*
      ========================================
      16. 勝敗
      ========================================
    */
    function endGame(text) {
      if (gameOver) return;

      gameOver = true;
      messageText.textContent = text;
      messageBox.style.display = "flex";

      if (text === "YOU WIN") {
        playWinSound();
      } else {
        playLoseSound();
      }
    }

    /*
      ========================================
      17. 描画
      ========================================
    */
    function drawBackground() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const g = ctx.createRadialGradient(
        stage.x, stage.y, 40,
        stage.x, stage.y, Math.max(canvas.width, canvas.height)
      );
      g.addColorStop(0, "#2a2a2a");
      g.addColorStop(1, "#080808");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawStage() {
      ctx.beginPath();
      ctx.arc(stage.x, stage.y, stage.radius, 0, Math.PI * 2);
      ctx.fillStyle = "#404040";
      ctx.fill();

      ctx.beginPath();
      ctx.arc(stage.x, stage.y, stage.radius * 0.82, 0, Math.PI * 2);
      ctx.fillStyle = "#2d2d2d";
      ctx.fill();

      ctx.beginPath();
      ctx.arc(stage.x, stage.y, stage.radius, 0, Math.PI * 2);
      ctx.lineWidth = 10;
      ctx.strokeStyle = "#bdbdbd";
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(stage.x, stage.y, stage.radius * 0.20, 0, Math.PI * 2);
      ctx.lineWidth = 3;
      ctx.strokeStyle = "rgba(255,255,255,0.18)";
      ctx.stroke();
    }

    function drawWeapon(spinner) {
      ctx.fillStyle = spinner.weaponColor;

      if (spinner.weaponType === "blade") {
        ctx.fillRect(
          spinner.radius - 2,
          -spinner.weaponWidth / 2,
          spinner.weaponLength,
          spinner.weaponWidth
        );
      }

      if (spinner.weaponType === "hammer") {
        ctx.fillRect(
          spinner.radius - 2,
          -4,
          spinner.weaponLength - 8,
          8
        );

        ctx.fillRect(
          spinner.radius + spinner.weaponLength - 14,
          -spinner.weaponWidth / 2,
          14,
          spinner.weaponWidth
        );
      }

      if (spinner.weaponType === "spear") {
        ctx.fillRect(
          spinner.radius - 2,
          -spinner.weaponWidth / 2,
          spinner.weaponLength - 10,
          spinner.weaponWidth
        );

        ctx.beginPath();
        ctx.moveTo(spinner.radius + spinner.weaponLength - 10, -10);
        ctx.lineTo(spinner.radius + spinner.weaponLength, 0);
        ctx.lineTo(spinner.radius + spinner.weaponLength - 10, 10);
        ctx.closePath();
        ctx.fill();
      }
    }

    function drawSpinner(spinner) {
      ctx.save();
      ctx.translate(spinner.x, spinner.y);
      ctx.rotate(spinner.angle);

      ctx.beginPath();
      ctx.arc(4, 5, spinner.radius, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(0,0,0,0.28)";
      ctx.fill();

      ctx.beginPath();
      ctx.arc(0, 0, spinner.radius, 0, Math.PI * 2);
      ctx.fillStyle = spinner.color;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(0, 0, spinner.radius, 0, Math.PI * 2);
      ctx.lineWidth = 4;
      ctx.strokeStyle = "rgba(255,255,255,0.35)";
      ctx.stroke();

      drawWeapon(spinner);

      ctx.beginPath();
      ctx.arc(0, 0, 8, 0, Math.PI * 2);
      ctx.fillStyle = "#ffffff";
      ctx.fill();

      ctx.restore();
    }

    /*
      ========================================
      18. 更新
      ========================================
    */
    function update() {
      if (gameOver) return;

      updatePlayer(player);
      updateCPU(cpu, player);

      updateSpinner(player);
      updateSpinner(cpu);

      resolveBodyCollision(player, cpu);

      handleWeaponHit(player, cpu);
      handleWeaponHit(cpu, player);

      updateParticles();

      if (checkRingOut(player)) {
        endGame("YOU LOSE");
      } else if (checkRingOut(cpu)) {
        endGame("YOU WIN");
      }
    }

    /*
      ========================================
      19. 描画
      ========================================
    */
    function draw() {
      drawBackground();
      drawStage();
      drawSpinner(player);
      drawSpinner(cpu);
      drawParticles();
    }

    /*
      ========================================
      20. メインループ
      ========================================
    */
    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
